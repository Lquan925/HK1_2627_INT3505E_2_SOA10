  /quiz-reviews/{review_id}/comment-suggestions:
    $ref: ./paths/quiz-reviews.yaml#/~1quiz-reviews~1{review_id}~1comment-suggestions
  /grade-goals:
    $ref: ./paths/grade-planning.yaml#/~1grade-goals
  /grade-goals/{goal_id}:
    $ref: ./paths/grade-planning.yaml#/~1grade-goals~1{goal_id}
  /grade-goals/{goal_id}/calculate:
    $ref: ./paths/grade-planning.yaml#/~1grade-goals~1{goal_id}~1calculate
  /learning-analyses:
    $ref: ./paths/recommendations.yaml#/~1learning-analyses
  /learning-analyses/{analysis_id}:
    $ref: ./paths/recommendations.yaml#/~1learning-analyses~1{analysis_id}
  /documents/{document_id}/chunks/{chunk_id}:
    $ref: ./paths/documents.yaml#/~1documents~1{document_id}~1chunks~1{chunk_id}
