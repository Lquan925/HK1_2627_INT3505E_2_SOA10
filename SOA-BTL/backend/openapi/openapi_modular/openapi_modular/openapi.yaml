  /chat/sessions/{session_id}/messages:
    $ref: ./paths/chat.yaml#/~1chat~1sessions~1{session_id}~1messages
  /quiz-reviews:
    $ref: ./paths/quiz-reviews.yaml#/~1quiz-reviews
  /quiz-reviews/{review_id}:
