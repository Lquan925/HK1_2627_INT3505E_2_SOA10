openapi: 3.0.3
info:
  title: AI Student Assistant API
  version: 2.0.0
  description: REST API cho AI Student Assistant trên Chrome Extension. Extension truy xuất dữ liệu Portal theo
    yêu cầu, quyền truy cập và consent UC02; không thu thập thông tin đăng nhập hoặc sửa dữ liệu Portal. Backend
    dùng token phiên ẩn danh, kiểm tra quyền sở hữu và consent. Token không xác minh quyền Portal; Extension kiểm
    tra lại quyền nguồn trước khi sử dụng. UC01 xử lý tại Extension; UC07 và UC09 giữ nguyên nghiệp vụ. Chat GENERAL
    không cần dữ liệu Portal. Khi đổi tài khoản hoặc logout, thu hồi phiên cũ. Chính sách lưu giữ dữ liệu và xác
    minh quyền Portal ở production cần được thống nhất.
servers:
- url: /api/v1
  description: API trên cùng máy chủ phục vụ đặc tả OpenAPI
tags:
- name: ClientSessions
  description: Phiên Extension ẩn danh, không phải tài khoản Portal hay phiên hội thoại.
- name: Consents
  description: Quản lý quyền cho phép sử dụng dữ liệu Portal (UC02)
- name: Documents
  description: Đồng bộ, tìm kiếm và tóm tắt tài liệu học tập (UC02, UC04, UC05)
- name: Chat
  description: Chat thông thường và hỏi đáp kiến thức RAG theo môn (UC03).
- name: QuizReviews
  description: Đánh giá tham khảo bài Quiz và gợi ý Comment gửi giảng viên (UC06, UC07)
- name: GradePlanning
  description: Thiết lập mục tiêu và dự tính điểm cần đạt (UC08, UC09)
- name: Recommendations
  description: Phân tích kết quả học tập và đề xuất nội dung ôn tập (UC10)
security:
- sessionAuth: []
